<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#222b35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>DiGe-FN Team Schedule</title>
<style>
:root{--bg:#EDF0F2;--card:#F8F9FA;--ink:#303D48;--line:#D5DCE1;--acc:#718A9B;box-sizing:border-box;color-scheme:light;--mut:#5C6974;--acc2:#A9BAC5;--hl:#E1E8EC;--ok:#8EAA9C;--acc-ink:#56707F;--acc-fill:#56707F;--ok-ink:#4D7060;--okbg:#E3ECE7;--warn:#6E5A3A;--warnbg:#F2EDE4;--err:#A8392F;--errbg:#F5E4E1;--overlay:rgba(34,43,51,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#222B33;--card:#2C3740;--ink:#E0E7EB;--line:#3D4A54;--acc:#8DA6B7;color-scheme:dark;--mut:#AEBCC6;--acc2:#718A9B;--hl:#35434D;--ok:#8EAA9C;--acc-ink:#8DA6B7;--acc-fill:#8DA6B7;--ok-ink:#8EAA9C;--okbg:#2F3F3A;--warn:#C5B49B;--warnbg:#3A3832;--err:#E3928A;--errbg:#43302F;--overlay:rgba(16,21,26,.62)}}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.app-h{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.app-h b{font-size:17px}.app-h span{font-size:12px;color:var(--mut)}
.app-tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px 16px 0;background:var(--card);border-bottom:1px solid var(--line)}
.app-tabs button{min-height:38px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);font:600 14px system-ui,sans-serif;cursor:pointer;border-radius:0}
.app-tabs button.on{color:var(--acc-ink);border-bottom-color:var(--acc-fill)}
.app-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.app-body>*{flex-shrink:0}
/* ---- schedule shared styles ---- */
.sch{--sg-nh:#1D8A8A;--sg-mn:#2f6fb5;--sg-gt:#8a5a00;--sg-ex:#2f7d3b;--sg-ot:#6b7280;--ccsg-cc:#c27800;--ccsg-ch:#4a5a70;--ccsg-rd:#6b7280;--ccsg-ot:#6b7280}
.sch-top{display:flex;flex-direction:column;gap:10px}
.sch-me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}.sch-me span{color:var(--mut)}
.sch-me.ask{flex-direction:column;align-items:stretch;gap:6px;border-color:var(--acc-fill)}.sch-me.ask select{min-height:42px}
.sch select,.sch input[type=date]{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 14px system-ui,sans-serif;padding:0 10px;max-width:100%;box-sizing:border-box}
.sch-lk{border:0;background:none;color:var(--acc-ink);font:600 13px system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:4px 2px}
.sch-mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sch-rev{font-size:12px;color:var(--mut)}.sch-dirty{color:var(--err)}
.sch-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.sch-seg button{min-height:38px;border:0;border-radius:9px;background:none;color:var(--mut);font:600 14px system-ui,sans-serif;cursor:pointer}.sch-seg button.on{background:var(--acc-fill);color:var(--bg)}
.sch-pick{display:flex;gap:8px;align-items:center}.sch-pick select{flex:1;min-width:0}
.sch-c{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:1px 6px;border-radius:6px;font:700 12px/1.5 system-ui,sans-serif;color:#fff;background:var(--sg-ot)}
.sch-c.sg-nh{background:var(--sg-nh)}.sch-c.sg-mn{background:var(--sg-mn)}.sch-c.sg-gt{background:var(--sg-gt)}.sch-c.sg-ex{background:var(--sg-ex)}
.sch-c.ccsg-cc{background:var(--ccsg-cc)}.sch-c.ccsg-ch{background:var(--ccsg-ch)}.sch-c.ccsg-rd{background:var(--ccsg-rd)}.sch-c.ccsg-ot{background:var(--ccsg-ot)}
.sch-nm{margin-left:6px;font-size:13px}.sch-mut{color:var(--mut);font-size:13px}
.sch-pc{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.sch-pch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sch-pch b{font-size:16px}
.sch-pc p{margin:0}.sch-nx{display:flex;flex-direction:column}.sch-nx span{font-size:12px;color:var(--mut)}.sch-nx b{font-size:15px}
.sch-now{padding:6px 8px;border-radius:8px;background:var(--okbg);color:var(--ok-ink)}.sch-cnt{font-size:13px;color:var(--mut)}
.sch-pl,.sch-rl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.sch-pr,.sch-rr{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}.sch-pr:first-child,.sch-rr:first-child{border-top:0}
.sch-pr{grid-template-columns:44px minmax(0,1fr) minmax(0,1.2fr)}
.sch-pd{display:flex;flex-direction:column;align-items:center;line-height:1.1}.sch-pd b{font-size:17px}.sch-pd i{font-style:normal;font-size:11px;color:var(--mut)}
.sch-ps{display:flex;flex-direction:column}.sch-ps i{font-style:normal;font-size:12px;color:var(--mut)}.sch-pg{font-size:13px}
.sch-pr.past,.sch-rr.past{opacity:.5}.sch-pr.today,.sch-rr.today{background:var(--hl)}.sch-pr.now{box-shadow:inset 3px 0 0 var(--ok-ink)}
.sch-rr.off{opacity:.55}.sch-rs{display:flex;flex-direction:column;gap:3px}.sch-rc{display:flex;align-items:center;gap:6px;font-size:13px}.sch-rc>i{font-style:normal;width:30px;color:var(--mut);font-size:12px}
.sch-chips{display:flex;flex-wrap:wrap;gap:6px}.sch-chips button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:600 13px system-ui,sans-serif;cursor:pointer}.sch-chips button.on{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--bg)}
.sch-note{margin:-4px 0 0}
.sch-day{display:grid;grid-template-columns:44px 1fr 44px auto;gap:6px}.sch-day button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 14px system-ui,sans-serif;padding:0 12px;cursor:pointer}.sch-day input{width:100%}
.sch-dh{margin:0;font-size:15px}
.sch-dc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.sch-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;gap:6px}.sch-ct{font-size:15px}
.sch-dl{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.sch-ds{display:flex;flex-direction:column}.sch-ds i{font-style:normal;font-size:11px;color:var(--mut)}.sch-dw{display:flex;align-items:center;flex-wrap:wrap;gap:2px}.sch-dw em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--ok-ink);background:var(--okbg);padding:1px 6px;border-radius:6px}
.sch-dl.mine .sch-nm{font-weight:700}.sch-dl.now{background:var(--okbg);margin:0 -6px;padding:6px 6px 6px 10px;border-radius:8px}
.sch-leg{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mut)}
.sch-hlp{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.sch-tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:70vh}
.sch-t{border-collapse:separate;border-spacing:0;font:12px system-ui,sans-serif}
.sch-t th,.sch-t td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;min-width:34px;height:28px}
.sch-t thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:700}.sch-t thead tr:nth-child(2) th{top:28px;font-weight:500;color:var(--mut)}
.sch-t th.sch-rh{position:sticky;left:0;z-index:3;background:var(--card);text-align:left;padding:2px 8px;min-width:118px;white-space:nowrap}
.sch-t tbody th.sch-rh{z-index:1;font-weight:500}.sch-t tbody th.sch-rh b{display:block;font-size:12px}.sch-t tbody th.sch-rh small{color:var(--mut);font-weight:400}.sch-t tbody th.sch-rh span{display:block;color:var(--mut);font-size:11px}
.sch-t tr.rg0 td,.sch-t tr.rg0 th{border-top:2px solid var(--ink)}
.sch-t th.off,.sch-t td.off{background:repeating-linear-gradient(135deg,rgba(214,40,40,.18) 0 4px,rgba(214,40,40,.06) 4px 8px)}
.sch-t th.today{background:var(--hl);color:var(--ink)}.sch-t th.sun{color:#c0392b}
.sch-t td{font-weight:700;cursor:default}.sch-t td[data-sv],.sch-t td[data-csv]{cursor:pointer}
.sch-t td.sg-nh{color:var(--sg-nh)}.sch-t td.sg-mn{color:var(--sg-mn)}.sch-t td.sg-gt{color:var(--sg-gt)}.sch-t td.sg-ex{color:var(--sg-ex)}.sch-t td.sg-ot{color:var(--sg-ot)}
.sch-t td.ccsg-cc{color:var(--ccsg-cc)}.sch-t td.ccsg-ch{color:var(--ccsg-ch)}.sch-t td.ccsg-rd{color:var(--ccsg-rd)}.sch-t td.ccsg-ot{color:var(--ccsg-ot)}
.sch-t.hlon td:not(.hl){opacity:.28}.sch-t td.hl{background:var(--acc-fill);color:var(--bg)!important;opacity:1}
.sch-msg{position:relative;padding:10px 34px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}.sch-msg p{margin:0 0 4px}.sch-msg p.ok{color:var(--ok-ink)}.sch-msg p.bad{color:var(--err)}.sch-msg ul{margin:4px 0 0;padding-left:18px}
.sch-x{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--mut);font-size:14px;cursor:pointer}
.sch-blank{padding:18px;border:1px dashed var(--line);border-radius:10px;background:var(--card)}.sch-blank p{color:var(--mut);font-size:14px}
.sch-big{min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--acc-fill);color:var(--bg);font:700 15px system-ui,sans-serif;cursor:pointer}
.sch-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sch-empty{color:var(--mut);font-size:14px;margin:4px 0}

/*CCSP: day/night colour coding + green rest days, matching the printed CC roster*/
.sch{--ccsp-ds:#b06d00;--ccsp-ns:#2f5fa8;--ccsp-ds-bg:#fff3d9;--ccsp-ns-bg:#e4ecfa;--ccsp-ds-ln:#e3a43a;--ccsp-ns-ln:#7c9fd4;--ccsp-rd:#2f7d3b;--ccsp-rd-bg:#e6f4ea;--ccsp-rd-ln:#6aae79}
.ccsp-ds{color:var(--ccsp-ds)}.ccsp-ns{color:var(--ccsp-ns)}.ccsp-rd{color:var(--ccsp-rd)}
.sch-sp{display:inline-flex;align-items:center;gap:4px;font:700 11px/1.7 system-ui,sans-serif;letter-spacing:.04em;padding:0 7px;border-radius:999px;white-space:nowrap}
.sch-sp.ccsp-ds{background:var(--ccsp-ds-bg);color:var(--ccsp-ds)}
.sch-sp.ccsp-ns{background:var(--ccsp-ns-bg);color:var(--ccsp-ns)}
.sch-sp.ccsp-rd{background:var(--ccsp-rd-bg);color:var(--ccsp-rd)}
.sch-rd{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:1px 6px;border-radius:6px;font:700 12px/1.5 system-ui,sans-serif;color:var(--ccsp-rd);background:var(--ccsp-rd-bg)}
.sch-pr.ccsp-ds,.sch-dl.ccsp-ds{border-left:4px solid var(--ccsp-ds-ln)}
.sch-pr.ccsp-ns,.sch-dl.ccsp-ns{border-left:4px solid var(--ccsp-ns-ln)}
.sch-pr.ccsp-rd,.sch-dl.ccsp-rd{border-left:4px solid var(--ccsp-rd-ln)}
.sch-rc.ccsp-ds>i{color:var(--ccsp-ds);font-weight:700}
.sch-rc.ccsp-ns>i{color:var(--ccsp-ns);font-weight:700}
.sch-t tr.ccsp-ds>td:not(.off){background:var(--ccsp-ds-bg)}
.sch-t tr.ccsp-ns>td:not(.off){background:var(--ccsp-ns-bg)}
.sch-t tr.ccsp-ds>td.ccsg-cc,.sch-t tr.ccsp-ds>td.ccsg-ch,.sch-t tr.ccsp-ds>td.ccsg-ot{color:var(--ccsp-ds)}
.sch-t tr.ccsp-ns>td.ccsg-cc,.sch-t tr.ccsp-ns>td.ccsg-ch,.sch-t tr.ccsp-ns>td.ccsg-ot{color:var(--ccsp-ns)}
.sch-t tr.ccsp-ds>th.sch-rh span{color:var(--ccsp-ds);font-weight:700}
.sch-t tr.ccsp-ns>th.sch-rh span{color:var(--ccsp-ns);font-weight:700}
.sch-t td.rdc{color:var(--ccsp-rd);font-weight:700;background:var(--ccsp-rd-bg)!important}
/*CCNOW: the running shift is tinted in its own colour, amber for day and blue for night,
  with a heavier left edge, so it reads at a glance without a separate summary block.*/
.sch-dl.ccsp-ds.now{background:var(--ccsp-ds-bg);border-left-color:var(--ccsp-ds)}
.sch-dl.ccsp-ns.now{background:var(--ccsp-ns-bg);border-left-color:var(--ccsp-ns)}
.sch-dl.now>.sch-dw>em{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sch-dl.ccsp-ds.now>.sch-dw>em{color:var(--ccsp-ds)}
.sch-dl.ccsp-ns.now>.sch-dw>em{color:var(--ccsp-ns)}
.sch-pr.ccsp-ds.now{background:var(--ccsp-ds-bg);border-left-color:var(--ccsp-ds)}
.sch-pr.ccsp-ns.now{background:var(--ccsp-ns-bg);border-left-color:var(--ccsp-ns)}
/*GEONOW: the geologist tab gets the same treatment, drawn as an inset edge so the grid never shifts*/
.sch-dl.now{box-shadow:inset 4px 0 0 var(--ok-ink)}
.sch-dl.now>.sch-dw>em{color:var(--ok-ink)}
.sch-pr.now{box-shadow:inset 4px 0 0 var(--ok-ink)}
/*CCDARK: shift colours for the dark palettes*/
:root[data-theme="dark"] .sch{--ccsp-ds:#f0b64a;--ccsp-ns:#8fb2ec;--ccsp-ds-bg:rgba(240,182,74,.14);--ccsp-ns-bg:rgba(143,178,236,.14);--ccsp-ds-ln:#b4832f;--ccsp-ns-ln:#5c7cb3;--ccsp-rd:#73c98a;--ccsp-rd-bg:rgba(115,201,138,.14);--ccsp-rd-ln:#4e8c5e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sch{--ccsp-ds:#f0b64a;--ccsp-ns:#8fb2ec;--ccsp-ds-bg:rgba(240,182,74,.14);--ccsp-ns-bg:rgba(143,178,236,.14);--ccsp-ds-ln:#b4832f;--ccsp-ns-ln:#5c7cb3;--ccsp-rd:#73c98a;--ccsp-rd-bg:rgba(115,201,138,.14);--ccsp-rd-ln:#4e8c5e}}
/*PAL: the five DiGe-FN palettes, same tokens the main app uses*/

:root[data-pal="claude"][data-theme="dark"]{--bg:#262624;--card:#30302E;--ink:#ECE9DF;--mut:#B8B3A6;--line:#46433E;--acc:#D97757;--acc2:#A8573B;--hl:#3B3835;--acc-ink:#E58E6E;--acc-fill:#E08A6A;--sel:#3B3835;--row-alt:#2B2A28;--ok:#9BAE86;--ok-ink:#A9BC93;--okbg:#343B2E;--warnacc:#CBB58A;--warn:#CBB58A;--warnbg:#3A372F;--err:#E8897C;--errbg:#3A2420;--overlay:rgba(0,0,0,.6);color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-pal="claude"]:not([data-theme="light"]){--bg:#262624;--card:#30302E;--ink:#ECE9DF;--mut:#B8B3A6;--line:#46433E;--acc:#D97757;--acc2:#A8573B;--hl:#3B3835;--acc-ink:#E58E6E;--acc-fill:#E08A6A;--sel:#3B3835;--row-alt:#2B2A28;--ok:#9BAE86;--ok-ink:#A9BC93;--okbg:#343B2E;--warnacc:#CBB58A;--warn:#CBB58A;--warnbg:#3A372F;--err:#E8897C;--errbg:#3A2420;--overlay:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-pal="sage"]{--bg:#EEF1EC;--card:#F8FAF6;--ink:#2C3A30;--mut:#586A5C;--line:#D3DDD2;--acc:#7D9A82;--acc2:#B2C7B5;--hl:#E3EBE2;--acc-ink:#46654D;--acc-fill:#46654D;--sel:#E3EBE2;--row-alt:#F2F5F0;--ok:#7FA38A;--ok-ink:#3F6B4B;--okbg:#E1EDE3;--warnacc:#C5B49B;--warn:#6E5A3A;--warnbg:#F2EDE4;color-scheme:light}
:root[data-pal="sage"][data-theme="dark"]{--bg:#1F2823;--card:#29342D;--ink:#E1EAE3;--mut:#A9BAAE;--line:#3B4A40;--acc:#8FB398;--acc2:#6B8B73;--hl:#314037;--acc-ink:#8FB398;--acc-fill:#8FB398;--sel:#314037;--row-alt:#2D3831;--ok:#8FB398;--ok-ink:#9CC2A6;--okbg:#2B3F32;--warnacc:#C5B49B;--warn:#C5B49B;--warnbg:#3A3832;--err:#E8897C;--errbg:#3A2420;--overlay:rgba(0,0,0,.6);color-scheme:dark}
